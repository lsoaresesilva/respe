<p-toast></p-toast>
<!-- <chat-widget></chat-widget> -->

<div *ngIf="questao != null; else loading">


    <div class="p-grid" style="margin: 10px 10px 10px 10px">
        <app-breadcrumb-assunto [assunto]="assunto" [questao]="questao">
        </app-breadcrumb-assunto>


        <div class="p-col-12">
            <div class="p-grid">
                <div class="p-col-4">
                    <div class="p-grid">
                        <div class="p-col-12">
                            <div class="p-grid">
                                <div class="p-col-12">
                                    <button type="button" (click)="visualizarPlanejamento()" pButton
                                        label="Visualizar planejamento" class="p-button-help"
                                        *ngIf="exibirAutoInstrucao()"></button>
                                    <!--     <app-btn-avancar-questao style="margin-left:5px" [assunto]="assunto" [questao]="questao"
                    *ngIf="atividadeGrupo == null">
                  </app-btn-avancar-questao> -->
                                </div>
                                <div class="p-col-4">


                                </div>
                            </div>
                        </div>
                        <div class="p-col-12">
                            <dados-questao [assunto]="assunto" [questao]="questao" [submissao]="submissao"
                                id="dadosQuestao">
                            </dados-questao>
                            <div id="testsCases">
                                <app-visualizar-testes [questao]="questao"
                                    [submissao]="submissao"></app-visualizar-testes>
                            </div>

                        </div>
                        <div class="p-col-12">
                            <app-card-erros-programacao-pizza
                                [submissao]="submissao"></app-card-erros-programacao-pizza>
                        </div>
                    </div>

                </div>

                <div class="p-col-8">

                    <div class="p-grid">
                        <div class="p-col-12">

                            <p-confirmDialog header="Atenção" icon="pi pi-exclamation-triangle"></p-confirmDialog>
                            <div class="p-grid">
                                <div class="p-col-3">
                                    
                                    <button type="button" (click)="executar()" pButton id="btnExecutar" label="Executar"
                                    icon="pi pi-play" iconPos="left" class="ui-button-success" style="margin-right: 10px"></button>

                                    <ng-template #editorPadrao>

                                    </ng-template>

                                    <p-progressBar *ngIf="processandoSubmissao == true" mode="indeterminate"
                                        [style]="{ height: '6px', width: '120px', marginLeft:'50px', marginTop:'2px'}">
                                    </p-progressBar>
                                </div>
                                <div class="p-col-9">
                                    <button pButton pRipple type="button"
                                        icon="{{ submissao.status != getStatusExecucaoSubmissao().NAO_RESPONDIDA && submissao.status == getStatusExecucaoSubmissao().TESTSCASES_RESPONDIDOS_SUCESSO ? 'pi pi-check' : 'pi pi-times' }}" [ngClass]="{
      'p-button-rounded p-button-success': submissao.status == getStatusExecucaoSubmissao().TESTSCASES_RESPONDIDOS_SUCESSO,
      'p-button-rounded p-button-danger': submissao.status == getStatusExecucaoSubmissao().TESTSCASES_RESPONDIDOS_INSUCESSO
    }" pTooltip="{{ submissao.status == getStatusExecucaoSubmissao().TESTSCASES_RESPONDIDOS_SUCESSO ? 'Seu algoritmo está correto.' : submissao.status == getStatusExecucaoSubmissao().TESTSCASES_RESPONDIDOS_INSUCESSO ? 'Seu algoritmo apresenta um problema.' : '' }}"
                                        id="statusExecucaoAlgoritmo"
                                        *ngIf="submissao != undefined && submissao.isFinalizada != null"></button>

                                    <button type="button" (click)="visualizarResposta()" pButton
                                        label="Visualizar resposta" class="p-button-secondary" style="margin-left:10px"
                                        *ngIf="questao.getExemploCorreto() != null"></button>
        
                                </div>


                            </div>

                            <div class="p-grid">
                                <div class="p-col-12" id="divEditorProgramacao">
                                 
                              
                                  
                                </div>
                              </div>

                            <div *ngIf="isEditorPronto == false">Carregando editor..</div>

                        </div>
                        <div class="p-col-12">
                            <strong>Saída do programa</strong>

                            <div class="saida" style="min-height: 80%" id="consoleProgramacao">

                                <div *ngIf="submissao != null && submissao.status == getStatusExecucaoSubmissao().CONTEM_ERRO"  [innerHtml]="getMensagemErro()">
                                </div>
                                <div *ngIf="submissao != null">
                                  <app-console-erro [submissao]="submissao" *ngIf="submissao != null && submissao.status == getStatusExecucaoSubmissao().CONTEM_ERRO; else resultados"></app-console-erro>
                                  <ng-template #resultados>
                                    <div *ngFor="let resultado of submissao.resultadosTestsCases">
                                      <p-panel
                                        header="Entrada: {{ questao.getTestCaseById(resultado.testCase.id).entradas }}"
                                      >
                                        <div *ngFor="let saida of resultado.respostaAlgoritmo; let i = index" [innerHtml]="destacarDiferencasSaidas(questao.getTestCaseById(resultado.testCase.id), saida, i)"></div>
                                      </p-panel>
                                    </div>
                                  </ng-template>
                                </div>
                              </div>

                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #loading>Carregando questão...</ng-template>
